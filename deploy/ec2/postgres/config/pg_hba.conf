# Local administrative access inside the PostgreSQL container.
local   all             all                                     trust
local   replication     all                                     trust

# Internal clients on the directly connected Docker network may use the
# operational roles, but must still use TLS and SCRAM.
hostssl all             all             samenet                 scram-sha-256
hostssl replication     all             samenet                 scram-sha-256

# The only role accepted from external networks is the least-privilege reader.
hostssl all             produtividade_reader 0.0.0.0/0          scram-sha-256
hostssl all             produtividade_reader ::/0               scram-sha-256

# Reject every other encrypted external login before evaluating non-TLS rules.
hostssl all             all             0.0.0.0/0               reject
hostssl all             all             ::/0                    reject

# Fail closed if a client attempts an unencrypted TCP connection.
hostnossl all           all             0.0.0.0/0               reject
hostnossl all           all             ::/0                    reject
